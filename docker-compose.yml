version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aquaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquaflow_cawaco}
      POSTGRES_USER: ${POSTGRES_USER:-aquaflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Map cong rieng biet de khong xung dot voi cac ung dung database khac tren may
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aquaflow_user} -d $${POSTGRES_DB:-aquaflow_cawaco}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: aquaflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aquaflow_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aquaflow_cawaco}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
    ports:
      - "3000:3000"

  mini-app:
    build:
      context: .
      dockerfile: Dockerfile.mini-app
    container_name: aquaflow-mini-app
    restart: unless-stopped
    ports:
      - "8080:80"

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: aquaflow-admin
    restart: unless-stopped
    ports:
      - "8081:80"

volumes:
  postgres_data:
    driver: local
