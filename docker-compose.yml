version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aquaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquaflow_cawaco
      POSTGRES_USER: aquaflow_user
      POSTGRES_PASSWORD: aquaflow_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaflow_user -d aquaflow_cawaco"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: aquaflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://aquaflow_user:aquaflow_secure_password_2026@postgres:5432/aquaflow_cawaco?schema=public
      JWT_SECRET: aquaflow_jwt_production_secret_key_2026
      PAYMENT_WEBHOOK_SECRET: cawaco_vietqr_production_hmac_secret_2026
    ports:
      - "3000:3000"

  mini-app:
    build:
      context: .
      dockerfile: Dockerfile.mini-app
    container_name: aquaflow-mini-app
    restart: unless-stopped
    ports:
      - "8080:80"

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: aquaflow-admin
    restart: unless-stopped
    ports:
      - "8081:80"

volumes:
  postgres_data:
    driver: local
