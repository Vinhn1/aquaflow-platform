name: AquaFlow CI Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  quality-gate:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run 25 Automated Tests
        run: npx tsx --test apps/api/test/CustomerService.test.ts apps/api/test/TariffCalculator.test.ts apps/api/test/PaymentService.test.ts apps/api/test/QueueEngine.test.ts apps/api/test/Integration.test.ts

      - name: Verify Backend API Build
        run: npm --prefix apps/api run build
